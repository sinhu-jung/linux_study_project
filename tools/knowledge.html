<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux 기술 교재</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#23342e;font:16px/1.7 system-ui}main{max-width:1100px;margin:auto;padding:30px 24px}h1{font-size:28px}a{color:#247653}button,select,input{font:inherit;border:1px solid #c9d7cb;background:white;color:#23342e;border-radius:8px;padding:9px 12px}button{cursor:pointer}button:disabled{opacity:.5}input{min-width:150px;flex:1}.bar{display:flex;gap:10px;flex-wrap:wrap}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.stats div{padding:16px;background:white;border:1px solid #dce6dd;border-radius:10px;flex:1;min-width:150px}.stats b{display:block;font-size:26px}.stats span,.muted{font-size:13px;color:#64746d}.notice{padding:18px;background:#fff9ed;border:1px solid #e7d6ac;border-radius:12px}.entry{padding:20px;background:white;border:1px solid #dce6dd;border-radius:12px;margin:12px 0}.entry h2{font-size:18px;margin:0;overflow-wrap:anywhere}.entry p{font-size:14px;margin:6px 0;color:#64746d;overflow-wrap:anywhere}.entry a{font-size:14px}.entry .badge{display:inline-block;background:#eef3ec;padding:3px 8px;font-size:12px;border-radius:6px;margin-right:10px}#error{color:#a23030}.lessonlist{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.lessonlist a{border:1px solid #c9d7cb;border-radius:8px;padding:7px 12px;font-size:14px;background:white}details{margin:20px 0}summary{cursor:pointer}
</style></head><body><main><a href="/">← OS 학습 과정으로</a><h1>OS 기술·자료구조·알고리즘 교재</h1><p>분야별 수업을 검색하세요. 각 수업에는 쉬운 해설, 동작 원리, 사용 조건, 원본 코드, 문제와 답지가 있습니다. 학습실에서는 앞 단계를 풀고 다음 단계로 넘어갑니다.</p><div class="stats" id="stats"></div><div class="notice" id="notice"></div><details><summary>전체 OS 수업 순서</summary><div class="lessonlist" id="lessons"></div></details><div class="bar"><select id="mode" aria-label="검색 대상"><option value="lessons">해설·문제·답지 교재</option><option value="documents">문서·장치 규격·원리·사용법</option><option value="files">전체 소스 파일</option></select><select id="group" aria-label="분야"><option value="">모든 분야</option></select><input id="q" aria-label="검색어" placeholder="예: RCU, BPF, DMA, radix, crypto, barrier"><button id="search">검색</button></div><p class="muted">일반 문서와 YAML 장치 바인딩 규격·보조 파일을 함께 포함합니다. 제목은 원문 그대로입니다. 번역 문서도 포함하므로 제목 수는 서로 다른 기술의 개수가 아닙니다. 교재 검색에서 분야별 해설과 문제를 확인할 수 있습니다.</p><div id="error" role="alert"></div><div id="results"></div><div class="bar"><button id="prev">이전</button><button id="next">다음</button><span id="count" class="muted"></span></div></main><script>
const $=id=>document.getElementById(id);let offset=0,total=0,ticket=0;
async function load(resetGroups=false){const my=++ticket;try{const response=await fetch('/api/knowledge?'+new URLSearchParams({mode:$('mode').value,group:resetGroups?'':$('group').value,q:$('q').value,offset}));const d=await response.json();if(!response.ok)throw Error(d.error);if(my!==ticket)return;$('stats').replaceChildren(...[[d.guided,'해설·문제·답지 수업'],[d.questions,'정답·풀이 확인 문제'],[d.files.toLocaleString(),'추적 파일 · 전체 목록'],[d.documents.toLocaleString(),'Documentation 전체 파일']].map(([n,label])=>{const box=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span');b.textContent=n;s.textContent=label;box.append(b,s);return box}));$('notice').textContent=d.coverage_note;$('lessons').replaceChildren(...d.lessons.map(l=>{const a=document.createElement('a');a.textContent=l.title;a.href='/#'+l.id;return a}));if(resetGroups||$('group').options.length===1){$('group').replaceChildren();const all=document.createElement('option');all.value='';all.textContent='모든 분야';$('group').append(all,...d.groups.map(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;return o}))}total=d.total;$('results').replaceChildren(...d.items.map(item=>{const card=document.createElement('div');card.className='entry';const h=document.createElement('h2');h.textContent=item.title||item.path;const p=document.createElement('p');p.textContent=item.path+(item.line?' · '+item.line+'행':'');const summary=document.createElement('p');summary.textContent=item.summary||'전체 소스 목록의 원본 파일입니다. 이 파일 전체의 쉬운 해설이 작성됐다는 뜻은 아닙니다.';const badge=document.createElement('span');badge.className='badge';badge.textContent=item.ready?'해설·원리·문제·답지 · '+item.questions+'문제':item.path.includes('/obsolete/')||item.path.includes('/removed/')?'폐기·제거된 인터페이스 · 역사 자료':'원문 색인 · 쉬운 해설 별도';const a=document.createElement('a');a.textContent=item.ready?'수업 열기 · 앞 단계 완료 후 학습':'원문 전체와 사용 예제 읽기 ↗';a.href=item.ready?'/#'+item.id:'/explorer#'+encodeURIComponent(item.path)+(item.line?'?line='+item.line:'');if(!item.ready){a.target='_blank';a.rel='noopener'}card.append(h,p,summary,badge,a);return card}));if(!d.items.length)$('results').textContent='일치하는 항목이 없습니다. 영어 키워드나 파일 경로로도 검색해보세요.';$('count').textContent=`${total.toLocaleString()}개 결과 · ${total?offset+1:0}–${Math.min(offset+50,total)}`;$('prev').disabled=offset===0;$('next').disabled=offset+50>=total;$('error').textContent=''}catch(e){$('error').textContent=e.message}}
$('search').onclick=()=>{offset=0;load()};$('q').onkeydown=e=>{if(e.key==='Enter')$('search').click()};$('mode').onchange=()=>{offset=0;load(true)};$('group').onchange=()=>{offset=0;load()};$('prev').onclick=()=>{offset=Math.max(0,offset-50);load();window.scrollTo({top:0})};$('next').onclick=()=>{offset+=50;load();window.scrollTo({top:0})};load();
</script></body></html>
